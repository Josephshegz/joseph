<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      
      #cartPopup {
        position: fixed;
        top: 10px;
        right: 10px;
        width: 300px;
        
        padding: 9px;
        display: none;
      }
      #cartPopupHeader {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
    </style>
  </head>
  <body onload="getLocal()" class="px-3 pt-5">

    
    <div class="d-flex justify-content-end mb-3">
      <button class="btn btn-primary" onclick="openCart()">🛒 Cart (<span id="cartCount">0</span>)</button>
    </div>


    <div id="cartPopup">
      <div id="cartPopupHeader">
        <h5 class="mb-0">Shopping Cart</h5>
        <button class="btn-close" onclick="closeCart()"></button>
      </div>
      <div id="cartResult" class="mt-2"></div>
    </div>

    
    <div class="d-flex mb-3">
      <input type="text" id="prodName" placeholder="Product Name" autofocus />
      <input type="text" id="prodPrice" placeholder="Product Price"/>
      <input type="text" id="prodQuan" placeholder="Product Quantity" />
      <input type="text" id="prodImage" placeholder="Product Image" />
      <button onclick="submitProduct()" class="btn btn-dark">Submit Product</button>
    </div>

    <h3>Products</h3>
    <div id="result" class="d-flex gap-2 flex-wrap"></div>


    <div class="mt-3">
      <button class="btn btn-dark" onclick="deleteFirst()">Delete First</button>
      <button class="btn btn-dark" onclick="addAsFirst()">Add as first</button>
      <button class="btn btn-dark" onclick="reverseItems()">Reverse Items</button>
      <button class="btn btn-dark" onclick="clearAll()">Clear all</button>
      <button class="btn btn-dark" onclick="deleteLastItem()">Delete Last</button>
    </div>

    <script>
      let products = [];

      function submitProduct() {
        if (prodName.value.trim().length < 1) {
          alert("Fill a product name");
        } else {
          let prodObj = {
            productName: prodName.value,
            productPrice: prodPrice.value,
            productImage: prodImage.value,
            productQuantity: prodQuan.value,
            addedToCart: false
          };
          products.push(prodObj);
          storeToLocal();
          prodName.value = "";
          displayProd();
        }
      }

      function storeToLocal(){
        localStorage.setItem("products", JSON.stringify(products));
      }

      function getLocal(){
        let storedProd = localStorage.getItem("products");
        let convProd = JSON.parse(storedProd);
        if(convProd){
          products = convProd;
        }
        displayProd();
        updateCartCount();
      }

      function displayProd(){
        result.innerHTML = "";
        for (let i = 0; i < products.length; i++) {
          result.innerHTML += `
            <div class="card" style="width: 18rem;">
              <img src="${products[i].productImage}" class="card-img-top" alt="...">
              <div class="card-body">
                <h5 class="card-title">${products[i].productName}</h5>
                <p class="card-text">${products[i].productPrice}</p>
                <span>
                  <button class="btn btn-danger" onclick='deleteItem(${i})'>Delete</button>
                  <button class="btn btn-primary" onclick='editItem(${i})'>Edit</button>
                </span><br/>
                <button id="cart-${i}" class="${products[i].addedToCart ? 'btn btn-success' : 'btn btn-dark'}" onclick='addToCart(${i})'>
                  ${products[i].addedToCart ? "Added To Cart" : "Add To Cart"}
                </button>
              </div>
            </div>`;
        }
        updateCartCount();
      }

      function updateCartCount(){
        let count = products.filter(p => p.addedToCart).length;
        document.getElementById("cartCount").innerText = count;
      }

      function addToCart(index){
        products[index].addedToCart = !products[index].addedToCart;
        displayProd();
        storeToLocal();
        storeCartToLocal();
      }

      function storeCartToLocal(){
        let cartItems = products.filter(p => p.addedToCart);
        localStorage.setItem("cart", JSON.stringify(cartItems));
      }

      function getCartLocal(){
        let storedCart = localStorage.getItem("cart");
        if(storedCart){
          return JSON.parse(storedCart);
        }
        return [];
      }

      function openCart(){
        displayCart();
        document.getElementById("cartPopup").style.display = "block";
      }

      function closeCart(){
        document.getElementById("cartPopup").style.display = "none";
      }

      function displayCart(){
        let cartItems = getCartLocal();
        cartResult.innerHTML = "";
        for(let i=0; i<cartItems.length; i++){
          cartResult.innerHTML += `
            <div class="card mb-2">
              <img src="${cartItems[i].productImage}" class="card-img-top" alt="...">
              <div class="card-body">
                <h5 class="card-title">${cartItems[i].productName}</h5>
                <p class="card-text">${cartItems[i].productPrice}</p>
                <p class="card-text">Qty: ${cartItems[i].productQuantity}</p>
                <button class="btn btn-danger" onclick="deleteFromCart('${cartItems[i].productName}')">Delete From Cart</button>
              </div>
            </div>`;
        }
      }

      function deleteFromCart(name){
        let index = products.findIndex(p => p.productName === name && p.addedToCart);
        if(index !== -1){
          products[index].addedToCart = false;
        }
        storeToLocal();
        storeCartToLocal();
        displayProd();
        displayCart();
        updateCartCount();
      }
      
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
